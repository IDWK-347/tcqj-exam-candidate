schema_version: 1
preprocess:
  long_edge: 512
  square_ok: false
pairing:
  strategy: complete
backend:
  name: mast3r_sparse_ga
  weights_manifest: /workspace/assets/weights.json
  shared_intrinsics: false
  subsample: 4
  coarse_iterations: 100
  refine_iterations: 100
  coarse_lr: 0.07
  refine_lr: 0.01
  matching_conf_thr: 0.0
runtime:
  device: cuda
  precision: fp32
scene:
  id: scene_b
  manifest: /workspace/data/scene_b/manifest.json
output:
  root: /workspace/outputs
